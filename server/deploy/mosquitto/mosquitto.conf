# Mosquitto configuration for the VERITEK IoT platform.
#
# Implements the section 18 rules: no anonymous access, per-gateway
# credentials, an ACL that confines each gateway to its own topic namespace,
# and TLS on the internet-facing listener.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---------------------------------------------------------- authentication --
# THE IMPORTANT LINE. An anonymous broker on a public address is an open
# telemetry firehose and an open injection point.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

# Limits, so one misbehaving device cannot exhaust the broker.
max_packet_size 262144
max_inflight_messages 40
max_queued_messages 1000
message_size_limit 262144

# ------------------------------------------------------ plaintext listener --
# LAN and commissioning only. Do not expose 1883 to the internet - bind it to
# the private interface and reach it over a VPN or the cellular APN.
listener 1883 0.0.0.0

# ------------------------------------------------------------ TLS listener --
# The production listener. Enable once the gateway's TLS support is confirmed
# (one of the four open questions) and certificates are in deploy/mosquitto/certs.
#
# listener 8883 0.0.0.0
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# tls_version tlsv1.2
# require_certificate false
