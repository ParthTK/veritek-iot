# Mosquitto - production broker for the VERITEK IoT platform.
#
# Who may connect, and to which topics, is NOT in this file. It lives in the
# Dynamic Security plugin's database (dynamic-security.json on the data
# volume), and the backend manages it: provisioning a device creates its
# credential and its ACL there, suspending one disables it and drops its
# session. See server/src/iot/mqtt/dynsec.ts.
#
# Nothing secret is in this file.

# ---------------------------------------------------------- authentication --
# One directory for every listener: the TLS port and the internal port
# authenticate the same way. (per_listener_settings is deprecated in 2.1 and
# gone in 3.0; global is what it will be.)
#
# The line that matters most. An anonymous broker on a public address is an
# open telemetry firehose and an open injection point.
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# ------------------------------------------------------------- persistence --
# Sessions and queued QoS 1 messages survive a broker restart. The backend
# keeps a persistent session, so readings published while it is being
# redeployed wait here for it instead of being dropped.
persistence true
persistence_location /mosquitto/data/
# Write the in-memory store every minute. The default is 30 minutes, which
# would put half an hour of queued readings at risk on a crash.
autosave_interval 60
# A persistent session nobody has resumed in 30 days belongs to a device that
# is gone; stop holding messages for it.
persistent_client_expiration 30d

# ------------------------------------------------------------------ limits --
# One misbehaving device must not be able to exhaust the broker.
# 1 MB: large enough for a gateway flushing its offline buffer as one batch,
# small enough to refuse garbage.
max_packet_size 1048576
max_inflight_messages 100
# Per client. The backend's queue is the one that can grow - while it is
# restarting - so this is sized for that, and bounded in bytes too.
max_queued_messages 100000
max_queued_bytes 268435456
# Retained messages carry each gateway's last online/offline status.
retain_available true

# max_connections and set_tcp_nodelay belong to a listener, and naming either
# one before the first `listener` line makes Mosquitto 2.1 create a default
# listener on 1883 - which then collides with the one below and the broker
# exits with "Address in use". They are set inside each block instead.

# ----------------------------------------------------------------- logging --
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# One line per connect and disconnect, with username and address: the broker's
# own audit trail of who tried to get in.
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Broker statistics on $SYS every 10 s; the backend mirrors them into
# Prometheus. Only the control identity may subscribe to them.
sys_interval 10

# ------------------------------------------------------- internal listener --
# The backend connects here over the private compose network. docker-compose
# publishes it on the host only as MQTT_PLAIN_BIND (loopback by default); a
# commissioning window can widen that, and it still requires credentials.
listener 1883
protocol mqtt
max_connections 10000
set_tcp_nodelay true

# ------------------------------------------------------------ TLS listener --
# What devices use. Let's Encrypt certificate, renewed automatically; the
# host's renewal timer restarts this container when it changes.
listener 8883
protocol mqtt
max_connections 10000
set_tcp_nodelay true
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
# Minimum version. TLS 1.0 and 1.1 are refused.
tls_version tlsv1.2
# Devices authenticate with username/password inside the TLS session; client
# certificates are not required.
require_certificate false
