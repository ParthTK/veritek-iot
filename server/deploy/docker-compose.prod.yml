# Production stack: EMQX + TimescaleDB + backend + Prometheus + Grafana.
#
# Everything here is reproducible from this repository (spec section 23). No
# step of the deployment is a command someone once ran on a VM by hand.
#
#   cp deploy/env/production.env.example deploy/env/production.env   # then edit
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/env/production.env up -d
#
# Secrets live in the env file, which is gitignored. Nothing secret is in here.

name: veritek-iot

x-restart: &restart
  # Survives SSH logout, application crash, container crash and VM reboot
  # (spec section 1).
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ------------------------------------------------------------------ broker --
  emqx:
    image: emqx/emqx:5.8.8
    <<: [*restart, *logging]
    container_name: veritek-emqx
    environment:
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_NODE__COOKIE: "${EMQX_NODE_COOKIE:?set EMQX_NODE_COOKIE}"
      # Authentication and authorization are declared in emqx.conf, rendered
      # from emqx.conf.template by deploy/scripts/render-emqx-config.sh so the
      # webhook secret never has to sit in git or in this file.
      EMQX_PROMETHEUS__ENABLE: "true"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD}"
    volumes:
      - ./emqx/etc/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/etc/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./certs:/opt/emqx/etc/certs:ro
    ports:
      # Public: TLS listener for gateways.
      - "8883:8883"
      # Public ONLY during a commissioning window - see deploy/scripts/firewall.sh.
      - "${MQTT_PLAIN_BIND:-127.0.0.1}:1883:1883"
      # Dashboard and Prometheus scrape stay on loopback; reach them over the
      # VPN or an SSH tunnel (spec section 16).
      - "127.0.0.1:18083:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------- database --
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    <<: [*restart, *logging]
    container_name: veritek-timescaledb
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-veritek}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-veritek_iot}"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    # NOT published. The database is reachable only on the internal compose
    # network - a physical gateway must never be able to see it (section 17).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritek} -d ${POSTGRES_DB:-veritek_iot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------- backend --
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    <<: [*restart, *logging]
    container_name: veritek-backend
    environment:
      NODE_ENV: production
      DEPLOY_ENVIRONMENT: "${DEPLOY_ENVIRONMENT:-production}"
      PORT: "4000"
      LOG_PRETTY: "false"
      DATABASE_URL: "postgres://${POSTGRES_USER:-veritek}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-veritek_iot}"
      # The backend reaches the broker inside the compose network, so this leg
      # needs no TLS; the public 8883 listener is where TLS is enforced.
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
      MQTT_USERNAME: "${MQTT_SERVICE_USERNAME:-energy-backend-ingestion}"
      MQTT_PASSWORD: "${MQTT_SERVICE_PASSWORD:?set MQTT_SERVICE_PASSWORD}"
      MQTT_CLIENT_ID: "veritek-backend-${DEPLOY_ENVIRONMENT:-production}"
      MQTT_TOPIC_ROOT: "${MQTT_TOPIC_ROOT:-energy/v1}"
      MQTT_VENDOR_TOPICS: "${MQTT_VENDOR_TOPICS:-}"
      MQTT_PUBLIC_HOST: "${MQTT_PUBLIC_HOST:?set MQTT_PUBLIC_HOST}"
      MQTT_PUBLIC_TLS_PORT: "8883"
      MQTT_PLAINTEXT_ENABLED: "${MQTT_PLAINTEXT_ENABLED:-false}"
      EMBEDDED_BROKER_ENABLED: "false"
      BROKER_WEBHOOK_SECRET: "${BROKER_WEBHOOK_SECRET}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      TOKEN_PEPPER: "${TOKEN_PEPPER:?set TOKEN_PEPPER}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}"
      INGEST_REQUIRE_AUTH: "true"
      AUTO_PROVISION_GATEWAYS: "${AUTO_PROVISION_GATEWAYS:-false}"
      AUTO_PROVISION_METERS: "${AUTO_PROVISION_METERS:-false}"
      SIMULATOR_ENABLED: "false"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      TLS_CERT_PATH_FOR_EXPIRY_CHECK: "/certs/fullchain.pem"
    volumes:
      - ./certs:/certs:ro
    expose:
      - "4000"
    healthcheck:
      # Readiness, not liveness: an instance with no database should be pulled
      # out of rotation rather than restarted in a loop.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      timescaledb:
        condition: service_healthy

  # ------------------------------------------------------- tls termination --
  nginx:
    image: nginx:1.27-alpine
    <<: [*restart, *logging]
    container_name: veritek-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  # Renews the certificate used by both nginx and EMQX, and reloads them.
  certbot:
    image: certbot/certbot:latest
    <<: *logging
    container_name: veritek-certbot
    volumes:
      - ./certs:/etc/letsencrypt/live-export
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook '/bin/sh /deploy-hook.sh'; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # ------------------------------------------------------------ monitoring --
  prometheus:
    image: prom/prometheus:v3.1.0
    <<: [*restart, *logging]
    container_name: veritek-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    <<: [*restart, *logging]
    container_name: veritek-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3000}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only. Reach it over the VPN or an SSH tunnel (section 16).
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # --------------------------------------------------------------- backups --
  backup:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    container_name: veritek-backup
    environment:
      PGHOST: timescaledb
      PGUSER: "${POSTGRES_USER:-veritek}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:-veritek_iot}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_S3_TARGET: "${BACKUP_S3_TARGET:-}"
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backup-data:/backups
    entrypoint: /bin/sh
    command: -c "while :; do sleep 86400 & wait $${!}; /usr/local/bin/backup.sh; done"
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  emqx-data:
  emqx-log:
  timescale-data:
  prometheus-data:
  grafana-data:
  certbot-etc:
  certbot-webroot:
  backup-data:
