# Production/staging stack: Mosquitto + TimescaleDB + backend + nginx +
# Prometheus + Grafana + node-exporter.
#
# Reproducible from this repository (spec section 23). Deployment:
#
#   ./deploy/scripts/gcp-bootstrap.sh deploy/env/staging.env
#
# which initialises the broker's credential store, issues the certificate,
# installs the renewal and backup timers, and starts this stack. Secrets live in the env file, which
# is gitignored. Nothing secret is in this file.
#
# Certificate renewal and database backups run as host systemd timers rather
# than containers: both need to reload other containers or write to Cloud
# Storage, and giving a container the Docker socket to do that would hand it
# root on the host.

name: veritek-iot

x-restart: &restart
  # Survives SSH logout, application crash, container crash and VM reboot
  # (spec section 1).
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ------------------------------------------------------------------ broker --
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2.1.2}
    <<: [*restart, *logging]
    container_name: veritek-mosquitto
    # Each connection is a file descriptor; the default 1024 would cap the
    # broker far below max_connections.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
      # Credentials (dynamic-security.json), sessions and queued messages.
      # Backed up nightly: losing it locks every device out.
      - mosquitto-data:/mosquitto/data
    ports:
      # Public: TLS listener for devices.
      - "8883:8883"
      # 127.0.0.1 keeps plaintext off the internet. MQTT_PLAIN_BIND=0.0.0.0
      # opens it for a commissioning window (credentials are still required).
      - "${MQTT_PLAIN_BIND:-127.0.0.1}:1883:1883"
    healthcheck:
      # Credential-free: an anonymous CONNECT must come back "not authorised".
      # That answer proves the broker is up, speaking MQTT and enforcing auth -
      # and a broker that ever accepted it would fail this check.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t healthcheck -C 1 -W 5 -V mqttv311 2>&1 | grep -qi 'not authori'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------- database --
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    <<: [*restart, *logging]
    container_name: veritek-timescaledb
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-veritek}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-veritek_iot}"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    # NOT published. Reachable only on the compose network; a gateway can never
    # see it (spec section 17).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritek} -d ${POSTGRES_DB:-veritek_iot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------- backend --
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: veritek-iot/backend:latest
    <<: [*restart, *logging]
    container_name: veritek-backend
    environment:
      NODE_ENV: production
      DEPLOY_ENVIRONMENT: "${DEPLOY_ENVIRONMENT:-production}"
      PORT: "4000"
      LOG_PRETTY: "false"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PUBLIC_BASE_URL: "https://${API_PUBLIC_HOST:?set API_PUBLIC_HOST}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-veritek}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-veritek_iot}"
      # Broker leg stays inside the compose network; TLS is enforced on the
      # public 8883 listener.
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TLS: "false"
      MQTT_USERNAME: "${MQTT_SERVICE_USERNAME:-energy-backend-ingestion}"
      MQTT_PASSWORD: "${MQTT_SERVICE_PASSWORD:?set MQTT_SERVICE_PASSWORD}"
      MQTT_CLIENT_ID: "veritek-backend-${DEPLOY_ENVIRONMENT:-production}"
      # Persistent session: the broker queues QoS 1 readings for the backend
      # while it restarts, instead of dropping them.
      MQTT_CLEAN_SESSION: "false"
      # Mosquitto holds the credentials; the backend manages them over the
      # broker's control API with this separate admin identity.
      MQTT_BROKER_AUTH: dynsec
      MQTT_CONTROL_USERNAME: "${MQTT_CONTROL_USERNAME:-veritek-control}"
      MQTT_CONTROL_PASSWORD: "${MQTT_CONTROL_PASSWORD:?set MQTT_CONTROL_PASSWORD}"
      MQTT_CONTROL_CLIENT_ID: "veritek-control-${DEPLOY_ENVIRONMENT:-production}"
      # EMQX's HTTP auth hooks; Mosquitto does not call them.
      BROKER_WEBHOOK_ENABLED: "false"
      MQTT_TOPIC_ROOT: "${MQTT_TOPIC_ROOT:-energy/v1}"
      MQTT_VENDOR_TOPICS: "${MQTT_VENDOR_TOPICS:-}"
      MQTT_SUBSCRIBE_TOPICS: "${MQTT_SUBSCRIBE_TOPICS:-}"
      MQTT_PUBLIC_HOST: "${MQTT_PUBLIC_HOST:?set MQTT_PUBLIC_HOST}"
      MQTT_PUBLIC_TLS_PORT: "8883"
      MQTT_PLAINTEXT_ENABLED: "${MQTT_PLAINTEXT_ENABLED:-false}"
      EMBEDDED_BROKER_ENABLED: "false"
      BROKER_WEBHOOK_SECRET: "${BROKER_WEBHOOK_SECRET:?set BROKER_WEBHOOK_SECRET}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      TOKEN_PEPPER: "${TOKEN_PEPPER:?set TOKEN_PEPPER}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}"
      INGEST_REQUIRE_AUTH: "true"
      AUTO_PROVISION_GATEWAYS: "${AUTO_PROVISION_GATEWAYS:-false}"
      AUTO_PROVISION_METERS: "${AUTO_PROVISION_METERS:-false}"
      SIMULATOR_ENABLED: "false"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      TLS_CERT_PATH_FOR_EXPIRY_CHECK: "/certs/fullchain.pem"
    volumes:
      - ./certs:/certs:ro
    expose:
      - "4000"
    healthcheck:
      # Readiness, not liveness: an instance with no database is pulled out of
      # rotation rather than restarted in a loop.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      timescaledb:
        condition: service_healthy
      # Started, not healthy: the backend retries the broker on its own, and
      # the API and dashboard should come up even while the broker does not.
      mosquitto:
        condition: service_started

  # ----------------------------------------------------- demo data writer --
  # Optional, and off unless explicitly started:
  #     docker compose --profile demo up -d demo-data
  #
  # Keeps the demonstration gateways reporting so the dashboard has live
  # numbers. It writes invented readings, so it must never run against a
  # deployment carrying real customer data - hence the profile, which keeps it
  # out of a plain `docker compose up`.
  demo-data:
    image: veritek-iot/backend:latest
    <<: [*restart, *logging]
    container_name: veritek-demo-data
    profiles: ["demo"]
    # Only a short backfill on start: the service restarts, and re-aggregating
    # a month of buckets every time would make each restart expensive. Load the
    # deep history once, by hand:
    #   docker exec veritek-backend node dist/scripts/seed-demo.js     #     --days 30 --interval 15 --purge-test
    command: ["node", "dist/scripts/seed-demo.js", "--days", "2", "--interval", "15", "--live"]
    environment:
      NODE_ENV: production
      LOG_PRETTY: "false"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-veritek}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-veritek_iot}"
      EMBEDDED_BROKER_ENABLED: "false"
      MQTT_ENABLED: "false"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      TOKEN_PEPPER: "${TOKEN_PEPPER:?set TOKEN_PEPPER}"
      BROKER_WEBHOOK_SECRET: "${BROKER_WEBHOOK_SECRET:?set BROKER_WEBHOOK_SECRET}"
      MQTT_PASSWORD: "${MQTT_SERVICE_PASSWORD:?set MQTT_SERVICE_PASSWORD}"
      MQTT_PUBLIC_HOST: "${MQTT_PUBLIC_HOST:?set MQTT_PUBLIC_HOST}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}"
    depends_on:
      timescaledb:
        condition: service_healthy

  # ------------------------------------------------------- tls termination --
  nginx:
    image: nginx:1.27-alpine
    <<: [*restart, *logging]
    container_name: veritek-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-webroot:/var/www/certbot:ro
      # The built dashboard, served as static files.
      - ./dashboard:/usr/share/nginx/dashboard:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

  # ------------------------------------------------------------ monitoring --
  prometheus:
    image: prom/prometheus:v3.1.0
    <<: [*restart, *logging]
    container_name: veritek-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"

  # Host CPU, memory and disk, so the capacity alerts have real data behind them.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: [*restart, *logging]
    container_name: veritek-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    pid: host
    expose:
      - "9100"

  grafana:
    image: grafana/grafana:11.5.1
    <<: [*restart, *logging]
    container_name: veritek-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3000}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only. Reach it over an SSH tunnel (section 16).
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  mosquitto-data:
  timescale-data:
  prometheus-data:
  grafana-data:
