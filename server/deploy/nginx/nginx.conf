# TLS termination for the dashboard API (spec section 16).
#
# Public surface is 443 only. The broker webhooks under /internal/ are refused
# here - EMQX reaches them directly on the compose network, so they never need
# to be routable from outside.

server {
    listen 80;
    server_name _;

    # ACME http-01 challenge, so certificates renew without downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 2m;

    # Internal-only paths. EMQX calls these over the compose network; nothing
    # outside has any reason to reach them.
    location /internal/ {
        return 404;
    }

    # Metrics are for Prometheus on the internal network, not the internet.
    location /metrics {
        return 404;
    }

    location / {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE and WebSocket for live dashboard updates: no buffering, long reads.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
