# TLS termination for the dashboard and API (spec section 16).
#
# Public surface: 80 (ACME challenge + redirect) and 443. The broker webhooks
# under /internal/ and the Prometheus /metrics endpoint are refused here - the
# broker and Prometheus reach the backend directly on the compose network.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ACME http-01 challenge, so renewal needs no downtime.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 2m;

    location /internal/ { return 404; }
    location = /metrics { return 404; }

    # API, live stream and the commissioning screen.
    location ~ ^/(api|ws|commissioning)(/|$) {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE and WebSocket: no buffering, long-lived reads.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # The dashboard: a single-page app, so unknown paths fall back to index.html.
    location / {
        root /usr/share/nginx/dashboard;
        try_files $uri $uri/ /index.html;

        location ~* ^/assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
