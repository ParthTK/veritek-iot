%% EMQX file-based ACL, evaluated BEFORE the HTTP authorizer.
%%
%% Only outright denials live here, so those requests never reach the backend.
%% Everything else falls through to the HTTP source, which applies each
%% credential's own ACL from the database.
%%
%% {eq, "#"} matters: a bare "#" in a rule is a wildcard FILTER that matches
%% every topic, so `{deny, all, subscribe, ["#"]}` would refuse every
%% subscription on the broker. {eq, ...} matches only a client literally asking
%% for the whole tree.

%% Nobody subscribes to the whole tree (spec section 8).
{deny, all, subscribe, [{eq, "#"}, {eq, "+/#"}]}.

%% Broker-internal topics are not for clients.
{deny, all, subscribe, ["$SYS/#"]}.
{deny, all, publish, ["$SYS/#"]}.

%% No catch-all here. Anything else goes to the HTTP authorizer.
