%% EMQX file-based ACL, evaluated BEFORE the HTTP authorizer.
%%
%% It exists only to deny things outright that no client should ever be allowed
%% to do, so those cases never even reach the backend. Everything else falls
%% through to the HTTP source, which reads each credential's own ACL from the
%% database.

%% Nobody subscribes to the whole tree. Not a device, not the backend, not a
%% debugging session that forgot to narrow its filter (spec section 8).
{deny, all, subscribe, ["#"]}.
{deny, all, subscribe, ["+/#"]}.

%% EMQX internal topics are for the broker and its dashboard, not for clients.
{deny, all, subscribe, ["$SYS/#"]}.
{deny, all, publish, ["$SYS/#"]}.

%% Everything else: ask the backend.
